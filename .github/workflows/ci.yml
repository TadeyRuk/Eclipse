name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `contracts/managed/` (compiled circuit + keys + zkir) is committed, so CI
      # needs neither the Compact compiler nor a proof server. Circuits are proven
      # locally by design; nothing here touches the network.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Privacy model covers every public field and circuit
        run: npm run check:privacy

  circuit-drift:
    name: compiled circuit matches source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Recompile with the pinned compiler and fail if the committed `managed/`
      # (circuit JS, prover/verifier keys, zkir) differs from what the source produces.
      # Proves the artifacts CI tests and the app serves are exactly this source.
      - name: Install Compact compiler 0.31.1
        run: |
          curl -fsSL -o compactc.zip \
            https://github.com/midnightntwrk/compact/releases/download/compactc-v0.31.1/compactc_v0.31.1_x86_64-unknown-linux-musl.zip
          mkdir -p "$RUNNER_TEMP/compactc"
          unzip -q compactc.zip -d "$RUNNER_TEMP/compactc"
          rm compactc.zip
          echo "$RUNNER_TEMP/compactc" >> "$GITHUB_PATH"

      - name: Recompile contract
        working-directory: contracts
        run: |
          compactc --version
          compactc src/eclipse.compact managed/eclipse

      - name: Fail on drift
        run: git diff --exit-code --stat -- contracts/managed
